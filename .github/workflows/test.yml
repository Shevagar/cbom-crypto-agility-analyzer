name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: cbom-analyzer --help
      - run: python -m unittest discover -s tests -v
      - run: cbom-analyzer scan examples/sample_product --json crypto-inventory.json --cyclonedx product.cdx.json --roadmap pqc-roadmap.json
      - name: Validate generated CycloneDX 1.7 CBOM
        run: docker run --rm -v "$PWD:/work" cyclonedx/cyclonedx-cli:0.33.1 validate --input-file /work/product.cdx.json --input-format json --input-version v1_7 --fail-on-errors
