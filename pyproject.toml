[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbom-crypto-agility-analyzer"
version = "0.1.0"
description = "Explainable cryptographic discovery, CycloneDX CBOM generation, and PQC migration analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shivani Agarwal"}]
keywords = ["cbom", "cyclonedx", "cryptography", "crypto-agility", "pqc", "post-quantum", "product-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
cbom-analyzer = "cbom_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["cbom_analyzer*"]
